[workspace]
resolver = "2"
members = [
    "crates/zeus-eth",
    "crates/zeus-railgun",
    "crates/zeus-railgun-snapshot",
    "crates/zeus-tokens",
    "crates/zeus-pools",
    "crates/zeus-bip32",
    "crates/zeus-wallet",
    "crates/zeus-poseidon",
    "crates/zeus-userop-kit",
]

[workspace.dependencies]
alloy-consensus = "=2.4.2"
alloy-contract = "=2.4.2"
alloy-dyn-abi = "=1.7.3"
alloy-eips = "=2.4.2"
alloy-json-rpc = "=2.4.2"
alloy-network = "=2.4.2"
alloy-primitives = "=1.7.3"
alloy-provider = "=2.4.2"
alloy-pubsub = "=2.4.2"
alloy-rpc-client = "=2.4.2"
alloy-rpc-types = "=2.4.2"
alloy-serde = "=2.4.2"
alloy-signer = "=2.4.2"
alloy-signer-local = "=2.4.2"
alloy-sol-types = "=1.7.3"
alloy-transport = "=2.4.2"
alloy-transport-http = "=2.4.2"
alloy-transport-ws = "=2.4.2"
alloy-tx-macros = "=2.4.2"
ruint = "=1.20.1"
generic-array = { version = "=0.14.7", features = ["zeroize"] }

[package]
name = "zeus"
authors = ["Michalis Molfetas <greekfetacheese@proton.me>"]
description = "A seedless, self-custodial Ethereum wallet that just works."
version = "0.9.54"
edition = "2024"
default-run = "zeus"
publish = false

[dependencies]

# GUI
eframe = { version = "=0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "links",
    "wayland",
    "x11",
] }
egui = { version = "=0.36", features = ["serde"] }
egui_extras = { version = "=0.36", features = ["image", "svg"] }
image = {version = "=0.25.10", default-features = false, features = ["png"]}
egui-elegance = "=0.16"
egui-lucide = "0.1"
egui-elements = {version = "1.2", features = ["full"]}
rfd = "=0.17.2"

# Zeus Crates
zeus-bip32 = { path = "crates/zeus-bip32", features = ["serde"] }
zeus-wallet = { path = "crates/zeus-wallet", features = ["serde"] }
zeus-eth = { path = "crates/zeus-eth" }
zeus-railgun = { path = "crates/zeus-railgun" }
userop-kit = { path = "crates/zeus-userop-kit" }

# Alloy
alloy-consensus = { workspace = true }
alloy-signer-local = { workspace = true, features = ["mnemonic"] }
alloy-eips = { workspace = true }
alloy-sol-types = { workspace = true, features = ["json"] }

# Force feature unification: RustCrypto 0.10 already pulls 0.14.7.
generic-array = { workspace = true }

# Crypto
rand = "=0.8"
minisign-verify = "=0.2.5"
sha2 = "0.10"


# Encryption
ncrypt-me = "0.4"
chacha20poly1305 = "=0.10"

# Memory
secure-types = { version = "0.5", features = ["codec"] }

# Tracing
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }
tracing-appender = "=0.2.3"

# Async
tokio = { version = "=1.47.1", features = ["rt-multi-thread"] }
warp = { version = "=0.4.2", features = ["server"] }
futures = "=0.3.31"
reqwest = { version = "0.13", features = ["json", "query"] }
rustls = "=0.23.45"

# Misc
brotli = "=8.0.4"
zip = {version = "=6.0.0", default-features = false, features = ["deflate"]}
tempfile = "=3.23.0"
semver = "=1.0.27"
self_update = { version = "1.2", default-features = false, features = [
    "github",
    "reqwest",
    "rustls",
] }
self-replace = "1"
sysinfo = "=0.37.2"
chrono = "=0.4.45"
either = "=1.15.0"
rayon = "=1.12.0"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
redb = "4"
lazy_static = "=1.5.0"
bincode-next = "=3.1.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[profile.dev]
# Default debug=2 emits full DWARF and a ~1GB zeus binary. Line tables are
# enough for backtraces and keep incremental artifacts / linking much smaller.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.prod]
inherits = "release"
codegen-units = 1
incremental = true
strip = true
# Slightly smaller binary size than level 3
opt-level = 2
debug = false
lto = "fat"

#[profile.prod.package."*"]
#opt-level = "z"

[features]
dev = []

[lints]
clippy = { new_without_default = "allow", too_many_arguments = "allow", unnecessary_unwrap = "allow", needless_return = "allow", needless_borrow = "deny" }