[package]
name = "zeus-poseidon"
description = "Circom-compatible Poseidon hash for BN254, with hashing of an arbitrary number of field elements"
readme = "README.md"
repository = "https://github.com/greekfetacheese/zeus/tree/master/crates/zeus-poseidon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Michalis Molfetas <greekfetacheese@proton.me>"]
license = "MIT"
keywords = ["poseidon", "hash", "circom", "bn254", "zero-knowledge"]
categories = ["cryptography", "algorithms"]

[dependencies]
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
ark-std = { version = "0.6", features = ["getrandom"] }
itertools = "0.14.0"
num-bigint = "0.4.6"
num-traits = "0.2.19"

[dev-dependencies]
rand = "0.9.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "poseidon_hash"
harness = false
