[package]
name = "zeus-mcp"
description = "Zeus's agent edge: the loopback MCP server an agent harness talks to"
version = "0.1.0"
edition = "2024"
authors = ["Michalis Molfetas <greekfetacheese@proton.me>"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
zeus-core = { path = "../zeus-core" }
zeus-eth = { path = "../zeus-eth" }

anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Declared explicitly, as in zeus-core: the binary only asks for `rt-multi-thread`, so `net` and
# `macros` reach this crate by feature unification alone and `cargo check -p zeus-mcp` would fail
# without them.
tokio = { version = "=1.47.1", features = [
    "net",
    "rt",
    "sync",
    "time",
    "macros",
    "io-util",
] }
tracing = "=0.1.41"
warp = { version = "=0.4.2", features = ["server"] }

[lints.clippy]
new_without_default = "allow"
too_many_arguments = "allow"
unnecessary_unwrap = "allow"
needless_return = "allow"
needless_borrow = "deny"
