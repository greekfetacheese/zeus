[package]
name = "zeus-tokens"
version = "0.1.0"
edition = "2024"
description = "Standalone CLI to generate Zeus default token list blobs without compiling the Zeus GUI"
publish = false

[[bin]]
name = "zeus-tokens"
path = "src/main.rs"

[dependencies]
zeus-eth = { path = "../zeus-eth" }
alloy-primitives = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "=4.5.53", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "=0.25.10"
bincode-next = "3.1.1"

[dev-dependencies]
tempfile = "3"
