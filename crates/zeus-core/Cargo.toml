[package]
name = "zeus-core"
description = "Zeus wallet domain: context, tx pipeline, vault, persistence"
readme = "readme.md"
repository = "https://github.com/greekfetacheese/zeus/tree/master/crates/zeus-core"
version = "0.1.0"
edition = "2024"
authors = ["Michalis Molfetas <greekfetacheese@proton.me>"]
license = "MIT OR Apache-2.0"
keywords = ["wallet", "ethereum", "self-custody", "transaction", "persistence"]
categories = ["cryptography", "finance"]

[dependencies]
zeus-eth = { path = "../zeus-eth", version = "0.1.4" }
zeus-railgun = { path = "../zeus-railgun", version = "0.1" }
zeus-wallet = { path = "../zeus-wallet", version = "0.1", features = ["serde"] }
zeus-bip32 = { path = "../zeus-bip32", version = "0.1", features = ["serde"] }
zeus-userop-kit = { path = "../zeus-userop-kit", version = "0.1" }

alloy-eips = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-consensus = { workspace = true }

secure-types = { version = "0.5", features = ["codec"] }
ncrypt-me = "0.4"
chacha20poly1305 = "=0.10"
brotli = "=8.0.4"
zip = { version = "=9.0.4", default-features = false, features = ["deflate"] }
redb = "4"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
anyhow = "=1.0.104"
either = "=1.15.0"
tracing = "=0.1.41"
chrono = "=0.4.45"
rand = "=0.8"
tempfile = "=3.23.0"
# Declared explicitly: the binary only lists `rt-multi-thread` and gets the rest by feature
# unification from zeus-eth/zeus-railgun, which `cargo check -p zeus-core` would not.
tokio = { version = "=1.47.1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "fs",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[features]
dev = []

[lints]
clippy = { new_without_default = "allow", too_many_arguments = "allow", unnecessary_unwrap = "allow", needless_return = "allow", needless_borrow = "deny" }
