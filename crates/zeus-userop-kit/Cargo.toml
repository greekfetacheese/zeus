[package]
name = "zeus-userop-kit"
description = "ERC-4337 user operation builder and bundler client for EntryPoint 0.7 and 0.8"
readme = "README.md"
repository = "https://github.com/greekfetacheese/zeus/tree/master/crates/zeus-userop-kit"
version = "0.1.0"
edition = "2024"
authors = ["Michalis Molfetas <greekfetacheese@proton.me>"]
license = "MIT"
keywords = ["erc4337", "account-abstraction", "useroperation", "bundler", "ethereum"]
categories = ["cryptography"]

[dependencies]

# Alloy
alloy-eips = { workspace = true }
alloy-serde = { workspace = true }
alloy-primitives = { workspace = true }
alloy-dyn-abi = { workspace = true }
alloy-provider = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-sol-types = { workspace = true, features = ["eip712-serde"] }

# Misc
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
alloy-signer-local = { workspace = true }
insta = "1.47.2"
