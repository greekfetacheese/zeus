[package]
name = "zeus-wallet"
description = "Generate Hierarchical Deterministic Wallets (BIP32) from a username and password"
readme = "readme.md"
repository = "https://github.com/greekfetacheese/zeus/tree/master/crates/zeus-wallet"
keywords = ["bip32", "crypto", "derivation"]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
version = "0.1.21"
edition = "2024"

[dependencies]
zeus-bip32 = { path = "../zeus-bip32", version = "0.1" }

alloy-signer-local = { workspace = true, features = ["mnemonic", "zeroize"] }
alloy-network = { workspace = true }
alloy-primitives = { workspace = true }

k256 = "0.14"
sha3 = "0.12"
rand = "0.8"
secure-types = "0.3"
argon2-rs = {version = "0.2", features = ["zeroize"]}
anyhow = "1"
serde = { version = "1", optional = true, features = ["derive"] }

[features]
serde = ["dep:serde", "secure-types/serde"]

[dev-dependencies]
serde_json = "1"
bip39 = "2"