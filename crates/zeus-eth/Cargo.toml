[package]
name = "zeus-eth"
description = "Utilities to interact with Ethereum"
readme = "readme.md"
repository = "https://github.com/greekfetacheese/zeus/tree/master/crates/zeus-eth"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]

# Alloy
alloy-sol-types = { workspace = true, features = ["json"] }
alloy-dyn-abi = { workspace = true, features = ["eip712"] }
alloy-primitives = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-signer = { workspace = true, features = ["eip712"] }

alloy-rpc-types = { workspace = true }
alloy-json-rpc = { workspace = true }
alloy-contract = { workspace = true }
alloy-network = { workspace = true }
alloy-provider = { workspace = true, features = ["ws"] }
alloy-transport = { workspace = true, features = ["throttle"] }
alloy-rpc-client = { workspace = true, features = ["reqwest"] }
alloy-pubsub = { workspace = true }
alloy-transport-http = { workspace = true }
alloy-transport-ws = { workspace = true }
alloy-tx-macros = { workspace = true }

# EVM
revm = { version = "43.0.0", features = [
    "std",
    "optional_block_gas_limit",
    "optional_no_base_fee",
    "optional_balance_check",
    "optional_eip3607",
] }

# Async
tokio = {version = "1", features = ["rt-multi-thread"]}
futures = "0.3"
tower = "0.5"

# Misc
tracing = "0.1"
url = "2.5"
anyhow = "1"
serde = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rand = "0.8"