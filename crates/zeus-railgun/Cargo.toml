[package]
name = "zeus-railgun"
version = "0.1.1"
edition = "2024"

[dependencies]

# Alloy
alloy-sol-types = { workspace = true, features = ["json"] }
alloy-primitives = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-provider = { workspace = true }
alloy-signer = { workspace = true }
alloy-contract = { workspace = true }

# Internal
poseidon-rust = { path = "../zeus-poseidon" }
userop-kit = { path = "../zeus-userop-kit" }

# Crypto
chacha20poly1305 = "0.10"
hex = "0.4"
bech32 = "0.9"
brotli = "8"
sha2 = "0.11"
aes-gcm = "0.10"
aes = "0.8"
ctr = "0.9"
hmac = {version = "0.13", features = ["zeroize"]}
curve25519-dalek = "4"
ed25519-dalek = "2.2.0"
ruint = { version = "1", features = ["serde", "num-bigint", "ark-ff-06", "zeroize"] }
rand_chacha = "0.9"
num-bigint = "0.4"
num-traits = "0.2"
ark-groth16 = { version = "0.6", default-features = false }
ark-std = { version = "0.6", features = ["getrandom"] }
ark-ff = "0.6.0"
ark-relations = "0.6"
ark-serialize = "0.6"
ark-circom = "0.6"
ark-ed-on-bn254 = "0.6.0"
ark-bn254 = "0.6.0"
k256 = "0.14"
sha3 = "0.12"

# Misc
bincode-next = { version = "3", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
wasmer = { version = "6.1", default-features = false }
redb = "4"
rand = "0.9"
lazy_static = "1"
anyhow = "1"
serde_json = "1"
secure-types = {version = "0.3", features = ["serde"]}
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }


[dev-dependencies]
bip39 = "2"
zeus-wallet = { path = "../zeus-wallet" }