[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Workspace crates that are not published to crates.io.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
# No crate allow/deny list yet. Do not add [bans.build] allow-build-scripts
# until the egui/wgpu/revm tree is explicitly ratcheted; it will drown the check.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
#allow-git = ["https://github.com/Robert-MacWha/ruint"]
